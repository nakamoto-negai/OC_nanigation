version: "3.9"

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: nav
      POSTGRES_PASSWORD: nav_pass
      POSTGRES_DB: navigation
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nav -d navigation"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    ports:
      - "8080:8080"
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_USER: nav
      DB_PASSWORD: nav_pass
      DB_NAME: navigation
      UPLOAD_DIR: /uploads
      ADMIN_PASSWORD: admin
      ADMIN_SECRET: dev-secret-change-in-production
      # 食堂編集用アカウント（食堂の混雑度だけを編集できる）のパスワード
      CAFETERIA_PASSWORD: cafeteria
    volumes:
      - uploads:/uploads
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build: ./frontend
    ports:
      # ホスト側のHTTPポートは FRONTEND_HTTP_PORT で変更可（既定3000）。
      # 3000 が他アプリと衝突する場合に逃がせる。コンテナ内は常に3000。
      - "${FRONTEND_HTTP_PORT:-3000}:3000"
      # HTTPS(443) をベースに統合。override 無し・素の `docker compose up` でも常に有効。
      # 443 が使えない/権限不足なら FRONTEND_HTTPS_PORT=8443 等に逃がして https://<IP>:8443 で開く。
      - "${FRONTEND_HTTPS_PORT:-443}:443"
    volumes:
      # 証明書。gen-local-cert.ps1 で作った LAN IP 入り証明書があればそれを使う。
      # 無ければコンテナ起動時に自己署名証明書を自動生成する（docker-ensure-cert.sh）。
      - ./certs:/etc/nginx/certs
    # 注: VITE_API_URL は設定しない。未設定だとフロントは相対パス（/api, /ws, /uploads）と
    # window.location.host を使うため、nginx の同一オリジンプロキシ経由で動作する。
    # これにより localhost でも LAN でも ngrok でも、URL を問わずそのまま機能する。
    depends_on:
      - backend

volumes:
  pgdata:
  uploads:
